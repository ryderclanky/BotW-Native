# Windows MinGW build. The Cafe runtime uses pthreads, so this is MSYS2 UCRT64 (gcc),
# not MSVC or clang-cl. generated/ is not in the repo, so the job links the guest stub.
# A green job means the runtime and the vendored Cemu layer compiled and linked.
# It does not launch the game (no dump, no GPU present test).
name: Windows (MinGW)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-glm
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-glslang
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBOTW_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel -- -k 0
      - name: Portable checks
        run: |
          ctest --test-dir build --output-on-failure
          g++ -std=c++20 launcher/launcher_data_test.cpp launcher/game_info.cpp launcher/mods.cpp launcher/setup_wizard.cpp launcher/unzip.cpp -lz -o build/launcher_data_test.exe
          ./build/launcher_data_test.exe
          g++ -std=c++20 -Iruntime/src tests/region_test.cpp runtime/src/region.cpp -o build/region_test.exe
          ./build/region_test.exe
          g++ -std=c++20 -pthread -Iruntime/include -Iruntime/src tests/swkbd_test.cpp runtime/src/misc/swkbd.cpp -o build/swkbd_test.exe
          ./build/swkbd_test.exe
          python tests/test_codegen_overrides.py
